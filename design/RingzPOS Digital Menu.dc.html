<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
body { margin:0; background:#e9eded; color:#171b1c; font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#0f7d6a; text-decoration:none; } a:hover { color:#0a6355; }
* { box-sizing:border-box; } button { font-family:inherit; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;justify-content:center;padding:32px 0">
  <div style="width:390px;height:844px;background:#fafbfb;border-radius:36px;border:10px solid #171b1c;overflow:hidden;position:relative;display:flex;flex-direction:column">
    <div style="padding:22px 20px 14px;background:#0f7d6a;color:#fff;display:flex;flex-direction:column;gap:4px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.85">TABLE T4 · MAIN HALL</span>
      <span style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600">Ringz Kitchen</span>
      <span style="font-size:12.5px;opacity:.85">Open until 23:00 · Prices include tax</span>
    </div>
    <div style="display:flex;gap:8px;padding:12px 16px;overflow-x:auto;flex:0 0 auto;background:#fff;border-bottom:1px solid #eceff0">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.onClick }}" style="flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-size:13px;font-weight:600;cursor:pointer">{{ c.label }}</button>
      </sc-for>
    </div>
    <div style="flex:1;overflow-y:auto;padding:8px 16px 110px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
        <div style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eceff0;opacity:{{ it.opacity }}">
          <div style="flex:1;display:flex;flex-direction:column;gap:4px">
            <span style="font-size:15px;font-weight:600">{{ it.name }}</span>
            <span style="font-size:12.5px;color:#6d777a;line-height:1.4;text-wrap:pretty">{{ it.desc }}</span>
            <span style="font-weight:600;color:#0a6355;margin-top:2px">{{ it.price }}</span>
          </div>
          <div style="width:96px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px">
            <div style="width:96px;height:80px;border-radius:10px;background:#eef1f2;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#97a1a4">photo</div>
            <button onClick="{{ it.add }}" style="height:30px;width:96px;border-radius:15px;border:1px solid {{ it.btnBorder }};background:#fff;color:{{ it.btnFg }};font-size:12.5px;font-weight:600;cursor:pointer">{{ it.btn }}</button>
          </div>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ hasCart }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:12px;right:12px;bottom:14px;background:#171b1c;color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px">
        <div style="display:flex;flex-direction:column;flex:1"><span style="font-size:12px;opacity:.75">{{ cartCount }} items</span><span style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600">{{ cartTotal }}</span></div>
        <button onClick="{{ send }}" style="height:42px;padding:0 16px;border:none;border-radius:11px;background:{{ sendBg }};color:#fff;font-size:13.5px;font-weight:600;cursor:pointer">{{ sendLabel }}</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'Mains', cart: {}, sent: false };
  renderVals() {
    const menu = [
      ['Jollof Rice & Chicken', 'Smoky party jollof with grilled chicken thigh and fried plantain.', 18, 'Mains'],
      ['Grilled Tilapia', 'Whole tilapia with pepper sauce, served with chips or yam.', 26, 'Mains'],
      ['Fried Rice & Turkey', 'Vegetable fried rice with peppered turkey wings.', 20, 'Mains'],
      ['Chicken Wings', 'Six wings, choice of sauce.', 14, 'Grill', true],
      ['Beef Suya Platter', 'Spiced beef skewers with onions and tomatoes.', 18, 'Grill'],
      ['Pepper Soup', 'Goat or catfish in a light, spicy broth.', 12, 'Starters'],
      ['Spring Rolls', 'Four crisp vegetable rolls with sweet chili dip.', 8, 'Starters'],
      ['Chapman', 'House fruit punch over ice.', 6, 'Drinks'],
      ['Zobo', 'Chilled hibiscus with ginger.', 4, 'Drinks']
    ];
    const f = n => '$' + n.toFixed(2);
    const c = this.state.cart;
    const count = Object.values(c).reduce((a, b) => a + b, 0);
    const total = menu.reduce((a, m) => a + (c[m[0]] || 0) * m[2], 0);
    return {
      cats: ['Starters', 'Mains', 'Grill', 'Drinks'].map(k => { const on = k === this.state.cat; return { label: k, bg: on ? '#0f7d6a' : '#fff', fg: on ? '#fff' : '#4d5659', border: on ? '#0f7d6a' : '#dde2e3', onClick: () => this.setState({ cat: k }) }; }),
      items: menu.filter(m => m[3] === this.state.cat).map(([name, desc, p, , out]) => {
        const q = c[name] || 0;
        return { name, desc, price: f(p), opacity: out ? .5 : 1,
          btn: out ? 'Unavailable' : q ? q + ' added' : 'Add', btnBorder: q ? '#0f7d6a' : '#dde2e3', btnFg: out ? '#97a1a4' : '#0a6355',
          add: () => !out && this.setState(s => ({ sent: false, cart: { ...s.cart, [name]: (s.cart[name] || 0) + 1 } })) };
      }),
      hasCart: count > 0, cartCount: count, cartTotal: f(total),
      sendLabel: this.state.sent ? 'Sent · waiter confirming' : 'Send to waiter',
      sendBg: this.state.sent ? '#4d5659' : '#0f7d6a',
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
