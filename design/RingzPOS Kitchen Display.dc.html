<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
body { margin:0; background:#12181a; color:#eef1f2; font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#5fd0bc; text-decoration:none; } a:hover { color:#8fe0d1; }
* { box-sizing:border-box; } button { font-family:inherit; }
</style>
</helmet>
<div style="min-height:100vh;min-width:1280px;display:flex;flex-direction:column">
  <header style="height:60px;background:#0b1011;border-bottom:1px solid #243033;display:flex;align-items:center;gap:20px;padding:0 24px">
    <div style="width:32px;height:32px;border-radius:9px;background:#0f7d6a;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700">R</div>
    <span style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600">Kitchen display</span>
    <div style="display:flex;gap:4px;background:#1b2427;border-radius:9px;padding:3px">
      <sc-for list="{{ stations }}" as="s" hint-placeholder-count="3">
        <button onClick="{{ s.onClick }}" style="height:32px;padding:0 14px;border:none;border-radius:6px;background:{{ s.bg }};color:{{ s.fg }};font-size:13px;font-weight:600;cursor:pointer">{{ s.label }}</button>
      </sc-for>
    </div>
    <div style="margin-left:auto;display:flex;gap:20px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#97a1a4">
      <span>{{ counts.open }} tickets</span><span style="color:#ff8a9c">{{ counts.late }} late</span><span>Avg 14:20</span>
      <a href="RingzPOS Floor Plan.dc.html" style="font-family:'IBM Plex Sans',sans-serif;font-weight:600">Floor →</a>
    </div>
  </header>
  <main style="flex:1;padding:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-content:start">
    <sc-for list="{{ tickets }}" as="t" hint-placeholder-count="8">
      <div style="background:#1b2427;border:1px solid {{ t.border }};border-radius:12px;overflow:hidden;display:flex;flex-direction:column">
        <div style="padding:12px 14px;background:{{ t.headBg }};display:flex;align-items:center;gap:10px">
          <span style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700">{{ t.table }}</span>
          <div style="display:flex;flex-direction:column"><span style="font-size:12px;font-weight:600">{{ t.type }}</span><span style="font-size:11.5px;opacity:.8">{{ t.ref }} · {{ t.waiter }}</span></div>
          <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600">{{ t.time }}</span>
        </div>
        <div style="padding:6px 14px;display:flex;flex-direction:column">
          <sc-for list="{{ t.lines }}" as="l" hint-placeholder-count="3">
            <button onClick="{{ l.onClick }}" style="all:unset;cursor:pointer;padding:10px 0;border-bottom:1px solid #243033;display:flex;gap:10px;align-items:flex-start">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;min-width:28px;text-decoration:{{ l.strike }};color:{{ l.qtyColor }}">{{ l.qty }}×</span>
              <div style="flex:1;display:flex;flex-direction:column;gap:2px">
                <span style="font-size:15px;font-weight:600;text-decoration:{{ l.strike }};color:{{ l.nameColor }}">{{ l.name }}</span>
                <span style="font-size:12.5px;color:#e0b565">{{ l.note }}</span>
              </div>
              <span style="height:22px;padding:0 8px;border-radius:11px;background:{{ l.stBg }};color:{{ l.stFg }};font-size:11px;font-weight:700;display:flex;align-items:center;letter-spacing:.04em">{{ l.status }}</span>
            </button>
          </sc-for>
        </div>
        <div style="margin-top:auto;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button style="height:40px;border:1px solid #3a4a4e;background:transparent;color:#eef1f2;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">Print KOT</button>
          <button onClick="{{ t.bump }}" style="height:40px;border:none;background:#0f7d6a;color:#fff;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">All ready</button>
        </div>
      </div>
    </sc-for>
  </main>
  <footer style="padding:0 24px 18px;font-size:12.5px;color:#6d777a">Tap a line to move it Pending → Preparing → Ready. Waiters mark Served from the order screen.</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    station: 'All',
    t: [
      { table: 'T4', type: 'Dine-in', ref: 'ORD-0142', waiter: 'Ada', min: 18, lines: [['Grilled Tilapia', 1, 'Large · no pepper', 'Preparing', 'Kitchen']] },
      { table: 'T11', type: 'Dine-in', ref: 'ORD-0147', waiter: 'Ada', min: 17, lines: [['Jollof Rice & Chicken', 4, '', 'Preparing', 'Kitchen'], ['Pepper Soup', 2, 'Goat', 'Ready', 'Kitchen'], ['Chapman', 6, '', 'Pending', 'Bar']] },
      { table: 'T7', type: 'Dine-in', ref: 'ORD-0145', waiter: 'Musa', min: 12, lines: [['Beef Suya Platter', 1, 'Extra onions', 'Pending', 'Kitchen'], ['Zobo', 2, '', 'Ready', 'Bar']] },
      { table: 'TA-31', type: 'Takeaway', ref: 'ORD-0149', waiter: 'Counter', min: 9, lines: [['Fried Rice & Turkey', 2, '', 'Pending', 'Kitchen'], ['Plantain Side', 2, '', 'Pending', 'Kitchen']] },
      { table: 'P2', type: 'Dine-in', ref: 'ORD-0150', waiter: 'Kemi', min: 6, lines: [['Spring Rolls', 2, '', 'Pending', 'Kitchen'], ['Puff-Puff', 1, '', 'Pending', 'Kitchen']] },
      { table: 'B1', type: 'Dine-in', ref: 'ORD-0151', waiter: 'Musa', min: 3, lines: [['Chapman', 2, 'Less ice', 'Pending', 'Bar']] },
      { table: 'DL-08', type: 'Delivery', ref: 'ORD-0152', waiter: 'Online', min: 2, lines: [['Jollof Rice & Chicken', 3, 'Pack separately', 'Pending', 'Kitchen']] }
    ]
  };
  renderVals() {
    const next = { Pending: 'Preparing', Preparing: 'Ready', Ready: 'Pending' };
    const ST = { Pending: ['#2f3b3e', '#c9d1d3'], Preparing: ['#1d4f8a', '#cfe3fb'], Ready: ['#0f7d6a', '#e6fbf6'] };
    const upd = (ti, li, fn) => this.setState(s => { const t = s.t.map(x => ({ ...x, lines: x.lines.map(l => [...l]) })); fn(t[ti], li); return { t }; });
    const tickets = this.state.t.map((t, ti) => {
      const lines = t.lines.map((l, li) => ({ l, li })).filter(({ l }) => this.state.station === 'All' || l[4] === this.state.station);
      if (!lines.length) return null;
      const late = t.min >= 15, done = lines.every(({ l }) => l[3] === 'Ready');
      return {
        table: t.table, type: t.type, ref: t.ref, waiter: t.waiter, time: String(t.min).padStart(2, '0') + ':' + (t.min * 7 % 60).toString().padStart(2, '0'),
        headBg: done ? '#0f7d6a' : late ? '#8a1f33' : '#243033', border: late && !done ? '#b4233c' : '#243033',
        lines: lines.map(({ l, li }) => ({ name: l[0], qty: l[1], note: l[2], status: l[3].toUpperCase(), stBg: ST[l[3]][0], stFg: ST[l[3]][1],
          strike: l[3] === 'Ready' ? 'line-through' : 'none', nameColor: l[3] === 'Ready' ? '#6d777a' : '#eef1f2', qtyColor: l[3] === 'Ready' ? '#6d777a' : '#5fd0bc',
          onClick: () => upd(ti, li, (tk, i) => { tk.lines[i][3] = next[tk.lines[i][3]]; }) })),
        bump: () => upd(ti, 0, tk => tk.lines.forEach(x => { x[3] = 'Ready'; })),
        late
      };
    }).filter(Boolean);
    return {
      stations: ['All', 'Kitchen', 'Bar'].map(s => ({ label: s, bg: s === this.state.station ? '#0f7d6a' : 'transparent', fg: s === this.state.station ? '#fff' : '#c9d1d3', onClick: () => this.setState({ station: s }) })),
      tickets, counts: { open: tickets.length, late: tickets.filter(t => t.late).length }
    };
  }
}
</script>
</body>
</html>
